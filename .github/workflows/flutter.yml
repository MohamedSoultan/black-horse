name: Flutter CI
on:
  push:
    paths: ['mobile-app/**']
  pull_request:
    paths: ['mobile-app/**']
jobs:
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile-app } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.47.4', channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }}
  ios:
    runs-on: macos-latest
    defaults: { run: { working-directory: mobile-app } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.47.4', channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build ios --release --no-codesign --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }}
